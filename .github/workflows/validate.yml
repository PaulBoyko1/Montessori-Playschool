name: Validate website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, copy-cleanup]

permissions:
  contents: write

jobs:
  install-home-logo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/copy-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: copy-cleanup

      - name: Rebuild and verify exact homepage logo
        shell: bash
        run: |
          set -euo pipefail
          cat .logo-parts/1.txt .logo-parts/2.txt .logo-parts/3.txt .logo-parts/4.txt .logo-parts/5.txt > /tmp/home-logo.b64
          test "$(wc -c < /tmp/home-logo.b64)" -eq 32228
          base64 -d /tmp/home-logo.b64 > public/images/montessori-home-logo-white.webp
          test "$(wc -c < public/images/montessori-home-logo-white.webp)" -eq 24170
          echo "80adeced190e2fba4d2aa76183f301b20eaeb60b1727cc4a3df77e65f38d1ebd  public/images/montessori-home-logo-white.webp" | sha256sum -c -

          sed -i 's#/images/montessori-home-logo-white.png#/images/montessori-home-logo-white.webp#g' app/page.tsx
          rm -f public/images/montessori-home-logo-white.png
          rm -rf .logo-parts

          cat > .github/workflows/validate.yml <<'EOF'
          name: Validate website

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22.13.0"

                - name: Install locked dependencies
                  run: npm run install:ci

                - name: Lint
                  run: npm run lint

                - name: Build and test rendered pages
                  run: npm test
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install verified white homepage logo"
          git push origin HEAD:copy-cleanup

  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Build and test rendered pages
        run: npm test
