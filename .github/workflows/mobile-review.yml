name: Review phone layouts

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "photo-source/**"
      - "scripts/mobile-review.mjs"
      - ".github/workflows/mobile-review.yml"
      - "package*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  mobile-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - run: npm ci
      - name: Prepare photo archive without the removed image
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { gunzipSync, gzipSync } from "node:zlib";
          import { createHash } from "node:crypto";
          const tar = gunzipSync(readFileSync("photo-source/photo-assets-final.tgz"));
          const entries = [];
          let removed = 0;
          for (let offset = 0; offset + 512 <= tar.length;) {
            const header = tar.subarray(offset, offset + 512);
            const name = header.subarray(0, 100).toString().replace(/\0.*$/, "");
            if (!name) break;
            const size = parseInt(header.subarray(124, 136).toString().replace(/\0.*$/, "").trim(), 8) || 0;
            const length = 512 + Math.ceil(size / 512) * 512;
            if (name.split("/").at(-1) === "home-hero.webp") removed++;
            else entries.push(tar.subarray(offset, offset + length));
            offset += length;
          }
          if (removed !== 1) throw new Error("Expected exactly one removed photo");
          const clean = gzipSync(Buffer.concat([...entries, Buffer.alloc(1024)]), { level: 9 });
          console.log("PHOTO_ARCHIVE_SHA256 " + createHash("sha256").update(clean).digest("hex"));
          const base64 = clean.toString("base64");
          for (let i = 0; i < base64.length; i += 6000) console.log("PHOTO_ARCHIVE_CHUNK " + base64.slice(i, i + 6000));
          NODE
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start the built website
        run: |
          npm run start > mobile-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat mobile-server.log
          exit 1
      - name: Review all pages at phone sizes
        run: node scripts/mobile-review.mjs
      - name: Save screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-layout-review
          path: |
            mobile-review/
            mobile-server.log
          retention-days: 14
